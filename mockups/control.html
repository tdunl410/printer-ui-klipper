<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Printer UI — Control</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <main class="device">
    <section class="screen">
      <header class="header">
        <div>
          <div class="printer-title">Console</div>
          <div class="subline">Macros + Terminal</div>
        </div>
        <a href="settings.html" class="icon-btn">Settings</a>
      </header>

      <section class="card">
        <div class="card-title">Macros</div>
        <div class="macro-item">QUAD_GANTRY_LEVEL</div>
        <div class="macro-item">BED_MESH_CALIBRATE</div>
        <div class="macro-item">LOAD_FILAMENT</div>
      </section>

      <section class="card">
        <div class="card-title">Console</div>
        <div class="console">
          <div class="console-line">Recv: ok T:236.2 /240.0 B:99.8 /100.0</div>
          <div class="console-line">Send: BED_MESH_PROFILE LOAD=default</div>
          <div class="console-line">Recv: // mesh loaded from profile [default]</div>
          <div class="console-line">Send: SET_FAN_SPEED FAN=part PERCENT=0.35</div>
        </div>
      </section>

      <a href="index.html" class="back-btn">← Back</a>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
