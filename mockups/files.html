<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Printer UI — Files</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <main class="device">
    <section class="screen">
      <header class="header">
        <div>
          <div class="printer-title">Model Files</div>
          <div class="subline">USB + Local + Network</div>
        </div>
        <a href="settings.html" class="icon-btn">Settings</a>
      </header>

      <section class="card">
        <div class="card-title">Recent</div>
        <div class="file-item">enclosure_bracket_v12.gcode</div>
        <div class="file-item">electronics_cover_v4.gcode</div>
        <div class="file-item">toolhead_backplate.gcode</div>
        <div class="file-item">bed_mesh_test_6x6.gcode</div>
      </section>

      <section class="card">
        <div class="card-title">Selected File</div>
        <div class="kv"><span>Name</span><strong>enclosure_bracket_v12.gcode</strong></div>
        <div class="kv"><span>Material</span><strong>ASA</strong></div>
        <div class="kv"><span>Est. Time</span><strong>4h 52m</strong></div>
        <div class="kv"><span>Layer Height</span><strong>0.20mm</strong></div>
      </section>

      <section class="card">
        <div class="btn-row">
          <div class="btn accent">Print Now</div>
          <div class="btn">Rename</div>
          <div class="btn">Delete</div>
        </div>
      </section>

      <a href="index.html" class="back-btn">← Back</a>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
