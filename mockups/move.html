<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Printer UI — Move</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <main class="device">
    <section class="screen">
      <header class="header">
        <div>
          <div class="printer-title">Move</div>
          <div class="subline">Jog + Homing + Fans</div>
        </div>
        <a href="settings.html" class="icon-btn">Settings</a>
      </header>

      <section class="card">
        <div class="card-title">Homing</div>
        <div class="btn-row">
          <div class="btn accent">Home All</div>
          <div class="btn">Home XY</div>
          <div class="btn">Home Z</div>
        </div>
      </section>

      <section class="card">
        <div class="card-title">Jog Axes</div>
        <div class="btn-row">
          <div class="btn">X-</div>
          <div class="btn">Y+</div>
          <div class="btn">X+</div>
        </div>
        <div style="height:10px"></div>
        <div class="btn-row">
          <div class="btn">Z+</div>
          <div class="btn">Y-</div>
          <div class="btn">Z-</div>
        </div>
      </section>

      <section class="card">
        <div class="card-title">Fan Speeds</div>
        <div class="kv"><span>Part Fan</span><strong>35%</strong></div>
        <div class="btn-row">
          <div class="btn">-10%</div>
          <div class="btn">Off</div>
          <div class="btn">+10%</div>
        </div>
        <div style="height:10px"></div>
        <div class="kv"><span>Chamber Fan</span><strong>65%</strong></div>
        <div class="btn-row">
          <div class="btn">-10%</div>
          <div class="btn">Off</div>
          <div class="btn">+10%</div>
        </div>
      </section>

      <a href="index.html" class="back-btn">← Back</a>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
