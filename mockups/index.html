<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Printer UI — Dashboard</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <main class="device">
    <section class="screen">
      <header class="header">
        <div>
          <div class="printer-title">Voron 2.4 <span style="font-size:22px;">▾</span></div>
          <div class="subline">Idle <span style="margin: 0 6px;">|</span> <span class="status-ok">Ready to Print</span></div>
        </div>
        <a href="settings.html" class="icon-btn">⚙ Settings</a>
      </header>

      <section class="status-row two">
        <article class="status-chip"><div class="k">State</div><div class="v">Idle</div></article>
        <article class="status-chip"><div class="k">Network</div><div class="v">Online</div></article>
      </section>

      <div class="hero">
        <img src="../assets/printer-render.png" alt="Printer render" />
        <div class="pill" style="left: 16px; top: 26px;">🧰 24°C <span class="target">/240°C</span></div>
        <div class="pill" style="right: 16px; bottom: 20px;">♨️ 60°C <span class="target">/0°C</span></div>
        <div class="pill" style="right: 16px; top: 26px;">🌡 38°C <span class="target">/45°C</span></div>
      </div>

      <div class="card-label">Machine Statistics</div>
      <section class="stats">
        <article class="stat">
          <div class="value">396h</div>
          <div class="label">Total Time</div>
        </article>
        <article class="stat">
          <div class="value">128</div>
          <div class="label">Print Count</div>
        </article>
        <article class="stat">
          <div class="value">8.7kg</div>
          <div class="label">Filament Usage</div>
        </article>
      </section>

      <a class="primary" href="print.html">Print</a>

      <section class="floating-actions">
        <a class="action-link" href="move.html">Move</a>
        <a class="action-link" href="preheat.html">Preheat</a>
        <a class="action-link" href="extrude.html">Extrude</a>
      </section>

      <nav class="dock">
        <a href="index.html" class="active">Home</a>
        <a href="print.html">Print</a>
        <a href="control.html">Control</a>
        <a href="settings.html">Settings</a>
      </nav>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
