<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Printer UI — Preheat</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <main class="device">
    <section class="screen">
      <header class="header">
        <div>
          <div class="printer-title">Preheat</div>
          <div class="subline">Nozzle + Bed + Chamber</div>
        </div>
        <a href="settings.html" class="icon-btn">Settings</a>
      </header>

      <section class="card">
        <div class="card-title">Temperature Setpoints</div>
        <div class="kv"><span>Nozzle</span><strong>24 / 240°C</strong></div>
        <div class="btn-row">
          <div class="btn">-5°C</div>
          <div class="btn">Off</div>
          <div class="btn">+5°C</div>
        </div>
        <div style="height:10px"></div>
        <div class="kv"><span>Bed</span><strong>60 / 100°C</strong></div>
        <div class="btn-row">
          <div class="btn">-5°C</div>
          <div class="btn">Off</div>
          <div class="btn">+5°C</div>
        </div>
        <div style="height:10px"></div>
        <div class="kv"><span>Chamber</span><strong>38 / 45°C</strong></div>
        <div class="btn-row">
          <div class="btn">-5°C</div>
          <div class="btn">Off</div>
          <div class="btn">+5°C</div>
        </div>
      </section>

      <section class="card">
        <div class="card-title">Presets</div>
        <div class="btn-row">
          <div class="btn">PLA</div>
          <div class="btn">ABS</div>
          <div class="btn">ASA</div>
        </div>
      </section>

      <section class="card">
        <div class="card-title">Sensors</div>
        <div class="kv"><span>Toolhead Ambient</span><strong>30°C</strong></div>
        <div class="kv"><span>Electronics Bay</span><strong>34°C</strong></div>
        <div class="kv"><span>Chamber Rear</span><strong>37°C</strong></div>
      </section>

      <a href="index.html" class="back-btn">← Back</a>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
